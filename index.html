<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CREATE X</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="main">
        <header>
            
            <nav>
                <div class="logo">
                    <h1>
                        CREATE
                        <img src="./images/Vector.png" alt="Logo img">
                    </h1>
                </div>
                <div class="nav-links">
                    <a href="/AboutUs">
                        About Us
                    </a>
                    <a href="/Courses">
                        Courses
                    </a>
                    <a href="/Events">
                        Events
                    </a>
                    <a href="/Blog">
                        Blog
                    </a>
                    <a href="/Contacts">
                        Contacts
                    </a>
                </div>
                <div class="nav-btn">
                    <div class="consultation">
                        <a href="/GetConsultation">
                            Get consultation
                        </a>
                    </div>

                    <div class="login">
                        <a href="/LogIn/Register">
                            <img src="./images/Person.png" alt="">
                            Log in / Register
                        </a>
                    </div>
                </div>
            </nav>

            <div class="play-video">
                <img src="./images/hover.png" alt="">
                <p>
                    Play showreel
                </p>
            </div>
            <div class="head-text">
                Enjoy studying <br
                >with Createx <br>
                Online Courses
            </div>
            <div class="head-btn">
                <button class="about-btn">
                    <a href="/AboutUs">
                        About Us
                    </a>
                </button>

                <button class="explore-btn">
                    <a href="/ExploreCourses">
                        Explore courses
                    </a>
                </button>
            </div>
            <div class="illustration">
                <img src="./images/illustration (1).png" alt="">
            </div>

            <div class="statistics">
                <div class="students">
                    <h1>
                        1200
                    </h1>
                    <p>
                        Students graduated
                    </p>
                </div>
                
                <img src="./images/ellipse.png" alt="">
                <div class="completed">
                    <h1>
                        84
                    </h1>
                    <p>
                        Completed courses
                    </p>
                </div>
                <img src="./images/ellipse.png" alt="">
                <div class="qualified">
                    <h1>
                        16
                    </h1>
                    <p>
                        Qualified tutors
                    </p>
                </div>
                <img src="./images/ellipse.png" alt="">
                <div class="years">
                    <h1>
                        5
                    </h1>
                    <p>
                        Years of experience
                    </p>
                </div>
            </div>
        </header>
    </div>



    <script src="./index.js"></script>
</body>
</html>
